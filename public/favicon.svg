<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="#0a0a0a"/>
  
  <!-- Red Pulse Symbol -->
  <g transform="translate(12, 16)">
    <!-- Pulse Line -->
    <path 
      d="M0 16 L12 16 L16 4 L20 28 L24 12 L28 20 L40 20" 
      stroke="#dc2626" 
      stroke-width="3" 
      stroke-linecap="round" 
      stroke-linejoin="round"
      fill="none"
    />
    
    <!-- R Letter stylized -->
    <text 
      x="20" 
      y="45" 
      font-family="Arial Black, sans-serif" 
      font-size="24" 
      font-weight="900" 
      fill="#ffffff"
      text-anchor="middle"
    >R</text>
  </g>
</svg>
