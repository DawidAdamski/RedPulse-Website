# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
#
# Local editing works out-of-the-box on localhost via the browser File System
# Access API (Chrome/Edge) - open http://localhost:4321/admin/index.html and
# choose "Work with Local Repository".
#
# Hosted editing at https://redpulse.tech/admin/ works via "Sign In Using Access
# Token" (a GitHub fine-grained PAT with Contents + Pull requests: write). The
# "Sign In with GitHub" button would need a sveltia-cms-auth relay (not set up).
#
# Collections are grouped by language (PL first, then EN) via labels, so the
# sidebar reads: PL - Blog / PL - O nas / PL - Uslugi / PL - FAQ / PL - Kontakt,
# then the EN set.

backend:
  name: github
  repo: DawidAdamski/RedPulse-Website
  branch: main

# Editorial workflow: each saved draft lives on its own branch / pull request and
# does NOT touch `main` (so it triggers no CI build or deploy). Clicking "Publish"
# merges one commit into `main`, which builds once and (via Watchtower) deploys
# once. Keeps history clean and avoids rebuild-on-every-save.
publish_mode: editorial_workflow

media_folder: /public/media
public_folder: /media

collections:
  # ---------------------------------------------------------------- Polish (PL)
  - name: blog_pl
    label: "PL · Blog"
    label_singular: "Wpis (PL)"
    folder: /src/content/blog/pl
    create: true
    extension: md
    format: frontmatter
    fields:
      - { name: title, label: Tytuł, widget: string, required: true }
      - { name: description, label: Opis, widget: text, required: true }
      - name: pubDate
        label: Data publikacji
        widget: datetime
        format: 'YYYY-MM-DD'
        date_format: 'YYYY-MM-DD'
        time_format: false
      - name: updatedDate
        label: Data aktualizacji
        widget: datetime
        format: 'YYYY-MM-DD'
        date_format: 'YYYY-MM-DD'
        time_format: false
        required: false
      - { name: heroImage, label: Obraz główny, widget: image, required: false }
      - { name: tags, label: Tagi, widget: list, required: false }
      - { name: draft, label: Szkic, widget: boolean, default: false }
      - name: levels
        label: "Poziomy głębi (1–5)"
        label_singular: "Poziom"
        widget: list
        min: 1
        max: 5
        summary: "{{fields.name}} — {{fields.audience}}"
        hint: "Warstwy tej samej treści, od najprostszej do najgłębszej. Pierwszy poziom jest wymagany; dwa lub więcej włącza interaktywny czytnik głębi."
        default:
          - { name: "Powierzchnia", audience: "Dla szefa", body: "" }
          - { name: "Nurkowanie", audience: "Dla osoby od IT", body: "" }
          - { name: "Głębia", audience: "Dla inżyniera", body: "" }
        fields:
          - { name: name, label: "Nazwa poziomu", widget: string, required: true }
          - { name: audience, label: "Dla kogo", widget: string, required: true }
          - { name: body, label: "Treść", widget: markdown, required: true }

  - name: about_pl
    label: "PL · O nas"
    files:
      - name: content
        label: O nas
        file: /src/content/about/pl.json
        fields:
          - { name: title, label: Tytuł, widget: string, required: true }
          - { name: subtitle, label: Podtytuł, widget: string, required: false }
          - { name: description, label: Opis, widget: text, required: true }
          - name: stats
            label: Statystyki
            widget: list
            required: false
            fields:
              - { name: value, label: Wartość, widget: string, required: true }
              - { name: label, label: Etykieta, widget: string, required: true }
          - name: highlights
            label: Wyróżnienia
            widget: list
            required: false
            fields:
              - { name: icon, label: Ikona, widget: select, options: [search, zap, link, lightbulb, server, layers, cpu, check, shield, cloud, code, rocket, cog, database, chart, puzzle, lock, bot] }
              - { name: title, label: Tytuł, widget: string, required: true }
              - { name: description, label: Opis, widget: text, required: true }

  - name: services_pl
    label: "PL · Usługi"
    files:
      - name: content
        label: Usługi
        file: /src/content/services/pl.json
        fields:
          - { name: title, label: Tytuł, widget: string, required: true }
          - { name: subtitle, label: Podtytuł, widget: string, required: false }
          - name: items
            label: Usługi
            widget: list
            required: false
            fields:
              - { name: icon, label: Ikona, widget: select, options: [search, zap, link, lightbulb, server, layers, cpu, check, shield, cloud, code, rocket, cog, database, chart, puzzle, lock, bot] }
              - { name: title, label: Tytuł, widget: string, required: true }
              - { name: price, label: "Cena (np. „od 800 zł/mc”)", widget: string, required: false }
              - { name: description, label: Opis, widget: text, required: true }

  - name: faq_pl
    label: "PL · FAQ"
    files:
      - name: content
        label: FAQ
        file: /src/content/faq/pl.json
        fields:
          - { name: title, label: Tytuł, widget: string, required: true }
          - { name: subtitle, label: Podtytuł, widget: string, required: false }
          - name: items
            label: Pytania
            widget: list
            required: false
            fields:
              - { name: question, label: Pytanie, widget: string, required: true }
              - { name: answer, label: Odpowiedź, widget: text, required: true }

  - name: contact_pl
    label: "PL · Kontakt"
    files:
      - name: content
        label: Kontakt
        file: /src/content/contact/pl.json
        fields:
          - { name: title, label: Tytuł, widget: string, required: true }
          - { name: subtitle, label: Podtytuł, widget: string, required: false }
          - { name: description, label: Opis, widget: text, required: true }
          - { name: emailLabel, label: "Etykieta e-mail", widget: string, required: true }
          - { name: email, label: "Adres e-mail", widget: string, required: true }
          - { name: phoneLabel, label: "Etykieta telefon", widget: string, required: true }
          - { name: phone, label: "Numer telefonu (puste = ukryty)", widget: string, required: false, hint: "Zostaw puste, żeby ukryć telefon. Wpisz numer, aby pokazać go na stronie." }
          - { name: consultationLabel, label: "Etykieta konsultacja", widget: string, required: true }
          - { name: consultationCta, label: "Tekst przycisku konsultacji", widget: string, required: true }
          - { name: socialLabel, label: "Etykieta social media", widget: string, required: true }
          - { name: cta, label: "Główny przycisk", widget: string, required: true }

  # --------------------------------------------------------------- English (EN)
  - name: blog_en
    label: "EN · Blog"
    label_singular: "Post (EN)"
    folder: /src/content/blog/en
    create: true
    extension: md
    format: frontmatter
    fields:
      - { name: title, label: Title, widget: string, required: true }
      - { name: description, label: Description, widget: text, required: true }
      - name: pubDate
        label: Publish date
        widget: datetime
        format: 'YYYY-MM-DD'
        date_format: 'YYYY-MM-DD'
        time_format: false
      - name: updatedDate
        label: Updated date
        widget: datetime
        format: 'YYYY-MM-DD'
        date_format: 'YYYY-MM-DD'
        time_format: false
        required: false
      - { name: heroImage, label: Hero image, widget: image, required: false }
      - { name: tags, label: Tags, widget: list, required: false }
      - { name: draft, label: Draft, widget: boolean, default: false }
      - name: levels
        label: "Depth levels (1–5)"
        label_singular: "Level"
        widget: list
        min: 1
        max: 5
        summary: "{{fields.name}} — {{fields.audience}}"
        hint: "Layers of the same content, from simplest to deepest. The first level is required; two or more turn on the interactive depth reader."
        default:
          - { name: "Surface", audience: "For the owner", body: "" }
          - { name: "Dive", audience: "For the IT person", body: "" }
          - { name: "Depth", audience: "For the engineer", body: "" }
        fields:
          - { name: name, label: "Level name", widget: string, required: true }
          - { name: audience, label: "Who it's for", widget: string, required: true }
          - { name: body, label: "Content", widget: markdown, required: true }

  - name: about_en
    label: "EN · About"
    files:
      - name: content
        label: About
        file: /src/content/about/en.json
        fields:
          - { name: title, label: Title, widget: string, required: true }
          - { name: subtitle, label: Subtitle, widget: string, required: false }
          - { name: description, label: Description, widget: text, required: true }
          - name: stats
            label: Stats
            widget: list
            required: false
            fields:
              - { name: value, label: Value, widget: string, required: true }
              - { name: label, label: Label, widget: string, required: true }
          - name: highlights
            label: Highlights
            widget: list
            required: false
            fields:
              - { name: icon, label: Icon, widget: select, options: [search, zap, link, lightbulb, server, layers, cpu, check, shield, cloud, code, rocket, cog, database, chart, puzzle, lock, bot] }
              - { name: title, label: Title, widget: string, required: true }
              - { name: description, label: Description, widget: text, required: true }

  - name: services_en
    label: "EN · Services"
    files:
      - name: content
        label: Services
        file: /src/content/services/en.json
        fields:
          - { name: title, label: Title, widget: string, required: true }
          - { name: subtitle, label: Subtitle, widget: string, required: false }
          - name: items
            label: Services
            widget: list
            required: false
            fields:
              - { name: icon, label: Icon, widget: select, options: [search, zap, link, lightbulb, server, layers, cpu, check, shield, cloud, code, rocket, cog, database, chart, puzzle, lock, bot] }
              - { name: title, label: Title, widget: string, required: true }
              - { name: price, label: "Price (e.g. „from 800 PLN/mo”)", widget: string, required: false }
              - { name: description, label: Description, widget: text, required: true }

  - name: faq_en
    label: "EN · FAQ"
    files:
      - name: content
        label: FAQ
        file: /src/content/faq/en.json
        fields:
          - { name: title, label: Title, widget: string, required: true }
          - { name: subtitle, label: Subtitle, widget: string, required: false }
          - name: items
            label: Questions
            widget: list
            required: false
            fields:
              - { name: question, label: Question, widget: string, required: true }
              - { name: answer, label: Answer, widget: text, required: true }

  - name: contact_en
    label: "EN · Contact"
    files:
      - name: content
        label: Contact
        file: /src/content/contact/en.json
        fields:
          - { name: title, label: Title, widget: string, required: true }
          - { name: subtitle, label: Subtitle, widget: string, required: false }
          - { name: description, label: Description, widget: text, required: true }
          - { name: emailLabel, label: "Email label", widget: string, required: true }
          - { name: email, label: "Email address", widget: string, required: true }
          - { name: phoneLabel, label: "Phone label", widget: string, required: true }
          - { name: phone, label: "Phone number (empty = hidden)", widget: string, required: false, hint: "Leave empty to hide the phone. Enter a number to show it on the site." }
          - { name: consultationLabel, label: "Consultation label", widget: string, required: true }
          - { name: consultationCta, label: "Consultation button text", widget: string, required: true }
          - { name: socialLabel, label: "Social media label", widget: string, required: true }
          - { name: cta, label: "Primary button", widget: string, required: true }
