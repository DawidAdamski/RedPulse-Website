# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
#
# Local editing works out-of-the-box on localhost via the browser File System
# Access API (Chrome/Edge) - no OAuth or proxy server needed. Just open
# http://localhost:4321/admin/ and choose "work with local repository".
#
# Hosted editing at https://redpulse.tech/admin/ works via "Sign In Using Access
# Token" (a GitHub fine-grained PAT) - no OAuth relay required. The "Sign In with
# GitHub" button would need a sveltia-cms-auth relay, which is not set up.

backend:
  name: github
  repo: DawidAdamski/RedPulse-Website
  branch: main

# Editorial workflow: each saved draft lives on its own branch / pull request and
# does NOT touch `main` (so it triggers no CI build or deploy). Clicking "Publish"
# merges one commit into `main`, which builds once and (via Watchtower) deploys
# once. Keeps history clean and avoids rebuild-on-every-save.
# Note: the GitHub token used for sign-in must include "Pull requests: write".
publish_mode: editorial_workflow

media_folder: /public/media
public_folder: /media

collections:
  - name: blog_pl
    label: Blog (PL)
    label_singular: Post (PL)
    folder: /src/content/blog/pl
    create: true
    extension: md
    format: frontmatter
    fields:
      - { name: title, label: Title, widget: string, required: true }
      - { name: description, label: Description, widget: text, required: true }
      - name: pubDate
        label: Publish date
        widget: datetime
        format: 'YYYY-MM-DD'
        date_format: 'YYYY-MM-DD'
        time_format: false
      - name: updatedDate
        label: Updated date
        widget: datetime
        format: 'YYYY-MM-DD'
        date_format: 'YYYY-MM-DD'
        time_format: false
        required: false
      - { name: heroImage, label: Hero image, widget: image, required: false }
      - { name: tags, label: Tags, widget: list, required: false }
      - { name: draft, label: Draft, widget: boolean, default: false }
      - { name: body, label: Body, widget: markdown }

  - name: sections
    label: Sekcje strony
    files:
      - name: sections_pl
        label: Sekcje (PL)
        file: /src/content/sections/pl.json
        fields:
          - name: about
            label: O nas
            widget: object
            fields:
              - { name: title, label: Tytuł, widget: string, required: true }
              - { name: subtitle, label: Podtytuł, widget: string, required: false }
              - { name: description, label: Opis, widget: text, required: true }
              - name: stats
                label: Statystyki
                widget: list
                required: false
                fields:
                  - { name: value, label: Wartość, widget: string, required: true }
                  - { name: label, label: Etykieta, widget: string, required: true }
              - name: highlights
                label: Wyróżnienia
                widget: list
                required: false
                fields:
                  - { name: icon, label: Ikona, widget: select, options: [search, zap, link, lightbulb, server, layers, cpu, check, shield, cloud, code, rocket, cog, database, chart, puzzle, lock, bot] }
                  - { name: title, label: Tytuł, widget: string, required: true }
                  - { name: description, label: Opis, widget: text, required: true }
          - name: services
            label: Usługi
            widget: object
            fields:
              - { name: title, label: Tytuł, widget: string, required: true }
              - { name: subtitle, label: Podtytuł, widget: string, required: false }
              - name: items
                label: Usługi
                widget: list
                required: false
                fields:
                  - { name: icon, label: Ikona, widget: select, options: [search, zap, link, lightbulb, server, layers, cpu, check, shield, cloud, code, rocket, cog, database, chart, puzzle, lock, bot] }
                  - { name: title, label: Tytuł, widget: string, required: true }
                  - { name: description, label: Opis, widget: text, required: true }
          - name: faq
            label: FAQ
            widget: object
            fields:
              - { name: title, label: Tytuł, widget: string, required: true }
              - { name: subtitle, label: Podtytuł, widget: string, required: false }
              - name: items
                label: Pytania
                widget: list
                required: false
                fields:
                  - { name: question, label: Pytanie, widget: string, required: true }
                  - { name: answer, label: Odpowiedź, widget: text, required: true }
      - name: sections_en
        label: Sekcje (EN)
        file: /src/content/sections/en.json
        fields:
          - name: about
            label: O nas
            widget: object
            fields:
              - { name: title, label: Tytuł, widget: string, required: true }
              - { name: subtitle, label: Podtytuł, widget: string, required: false }
              - { name: description, label: Opis, widget: text, required: true }
              - name: stats
                label: Statystyki
                widget: list
                required: false
                fields:
                  - { name: value, label: Wartość, widget: string, required: true }
                  - { name: label, label: Etykieta, widget: string, required: true }
              - name: highlights
                label: Wyróżnienia
                widget: list
                required: false
                fields:
                  - { name: icon, label: Ikona, widget: select, options: [search, zap, link, lightbulb, server, layers, cpu, check, shield, cloud, code, rocket, cog, database, chart, puzzle, lock, bot] }
                  - { name: title, label: Tytuł, widget: string, required: true }
                  - { name: description, label: Opis, widget: text, required: true }
          - name: services
            label: Usługi
            widget: object
            fields:
              - { name: title, label: Tytuł, widget: string, required: true }
              - { name: subtitle, label: Podtytuł, widget: string, required: false }
              - name: items
                label: Usługi
                widget: list
                required: false
                fields:
                  - { name: icon, label: Ikona, widget: select, options: [search, zap, link, lightbulb, server, layers, cpu, check, shield, cloud, code, rocket, cog, database, chart, puzzle, lock, bot] }
                  - { name: title, label: Tytuł, widget: string, required: true }
                  - { name: description, label: Opis, widget: text, required: true }
          - name: faq
            label: FAQ
            widget: object
            fields:
              - { name: title, label: Tytuł, widget: string, required: true }
              - { name: subtitle, label: Podtytuł, widget: string, required: false }
              - name: items
                label: Pytania
                widget: list
                required: false
                fields:
                  - { name: question, label: Pytanie, widget: string, required: true }
                  - { name: answer, label: Odpowiedź, widget: text, required: true }

  - name: blog_en
    label: Blog (EN)
    label_singular: Post (EN)
    folder: /src/content/blog/en
    create: true
    extension: md
    format: frontmatter
    fields:
      - { name: title, label: Title, widget: string, required: true }
      - { name: description, label: Description, widget: text, required: true }
      - name: pubDate
        label: Publish date
        widget: datetime
        format: 'YYYY-MM-DD'
        date_format: 'YYYY-MM-DD'
        time_format: false
      - name: updatedDate
        label: Updated date
        widget: datetime
        format: 'YYYY-MM-DD'
        date_format: 'YYYY-MM-DD'
        time_format: false
        required: false
      - { name: heroImage, label: Hero image, widget: image, required: false }
      - { name: tags, label: Tags, widget: list, required: false }
      - { name: draft, label: Draft, widget: boolean, default: false }
      - { name: body, label: Body, widget: markdown }
